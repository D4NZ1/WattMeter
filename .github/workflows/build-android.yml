name: Build Android
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar zip
        run: |
          Z=$(ls *.zip | head -n1)
          echo "Zip: $Z"
          mkdir -p _src && unzip -q "$Z" -d _src
          S=$(find _src \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WattMeter-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
